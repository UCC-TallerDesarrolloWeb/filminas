### Frameworks CSS

Los frameworks CSS proporcionan un conjunto de estilos, componentes y utilidades predefinidas que permiten crear interfaces modernas de manera rápida y consistente. 

- Bootstrap
- TailwindCSS

Con ellos, los desarrolladores pueden enfocarse más en la funcionalidad y menos en la escritura repetitiva de estilos desde cero.

---

### Ventajas y desventajas de los frameworks CSS
<!-- .slide: style="font-size: 0.80em" -->
Ventajas:
- Aceleran el desarrollo inicial.
- Aseguran consistencia visual.
- Ofrecen componentes listos para usar.
- Amplia comunidad y documentación.

Desventajas:
- Código extra (estilos que no siempre se usan:** CSS bloat).
- Sitios que lucen demasiado similares si no se personalizan.
- Curva de aprendizaje (en especial en Tailwind).

---

### [Bootstrap](https://getbootstrap.com/)
Es uno de los frameworks más utilizados, ofrece un sistema de rejilla (grid system), componentes listos para usar (botones, formularios, menús) y utilidades que facilitan el diseño responsivo.

---

### [TailwindCSS](https://tailwindcss.com/)
Está basado en clases utilitarias, permite aplicar estilos directamente en el HTML de forma modular y altamente personalizable, lo que fomenta un flujo de trabajo ágil y flexible.

---

## Preprocesadores CSS

El CSS juega un papel central para definir la presentación y la experiencia visual de una página.

A medida que los proyectos se vuelven más complejos, mantener y escalar el código CSS puede resultar difícil. 

Para afrontar este desafío surgieron herramientas que **optimizan** y **aceleran** el trabajo con estilos, entre ellas los frameworks CSS y los preprocesadores CSS.
---

### Ventajas y desventajas de los preprocesadores
<!-- .slide: style="font-size: 0.80em" -->
Ventajas:
- CSS más organizado y mantenible.
- Reutilización de estilos (mixins, funciones).
- Permite trabajar con variables antes de que fueran estándar en CSS.

Desventajas:
- Necesitan un paso de compilación (no se interpretan directo en el navegador).
- Agregan complejidad al flujo de trabajo.
- Algunas funciones ya fueron incorporadas en CSS moderno (ej. variables nativas --var).

---

### Preprocesadores CSS

<!-- .slide: style="font-size: 0.80em" -->
Los preprocesadores CSS como [SASS](https://sass-lang.com/) y [LESS](https://lesscss.org/) extienden las capacidades nativas de CSS, añadiendo características propias de lenguajes de programación, tales como:
- Variables para colores, fuentes o medidas.
- Anidamiento de reglas para mejorar la legibilidad.
- Mixins y funciones para reutilizar bloques de estilo.
- Herencia y modularización que permiten mantener el código más limpio y organizado.

Estos archivos se escriben en sintaxis SASS o LESS y luego se compilan a CSS estándar para ser interpretados por los navegadores.

---

## ¿Qué es Sass?

Sass (**Syntactically Awesome Stylesheets**) es un **preprocesador CSS** que extiende el lenguaje con:
- Variables
- Anidación
- Mixins y funciones
- Módulos reutilizables (`@use` / `@forward`)

Al final, **Sass se compila en CSS estándar** que entiende cualquier navegador.

---

### ¿Qué necesito para ejecutar SASS?
Si bien no es obligatorio emplear [nodeJs](https://nodejs.org/en), cómo posteriormente realizaremos proyectos con frameworks de JavaScript (react), si es recomendable instalarlo.

#### ¿Y si no quiero instalar nodeJs ahora?
- Puedes utilizar [Dart](https://github.com/sass/dart-sass/releases) el compilar de Sass "standalone"
- Puedes usar un compilador de escritorio:
  - [Koala](http://koala-app.com/)
  - [Prepros](https://prepros.io/)
  - [Scout-App](https://scout-app.io/)

---

### SASS: Variables

Permiten **almacenar valores** (colores, tamaños, tipografías) para reutilizarlos.

```scss
$color-principal: #3498db;
$padding-base: 16px;

body {
  background: $color-principal;
  padding: $padding-base;
}
```

---

### SASS: Mixins

Un mixin agrupa reglas CSS reutilizables.

Se pueden parametrizar para mayor flexibilidad.

```scss
@mixin boton($color, $radius: 4px) {
  background: $color;
  border-radius: $radius;
  padding: 8px 12px;
  color: white;
}
```

---

### SASS: Include

Para usar un mixin, se lo invoca con @include.
```scss
.btn-primario {
  @include boton(#3498db, 8px);
}

.btn-secundario {
  @include boton(#2ecc71);
}
```

Evita duplicar código y mejora la mantenibilidad.

---

### SASS: Módulos con @use

Sass recomienda organizar el código en módulos.

@use importa un archivo Sass y le asigna un namespace.

```scss
// _variables.scss
$color-fondo: #f4f4f4;

// estilos.scss
@use 'variables';

body {
  background: variables.$color-fondo;
}
```

@use reemplaza a @import (deprecado) y evita conflictos de nombres.

---

### SASS: Uso del símbolo &
El símbolo **&** se usa para hacer referencia al selector padre dentro de una regla anidada. Esto es útil cuando quieres aplicar estilos específicos a elementos que son descendientes directos del selector padre.

```scss
.button {
  background-color: blue;
  &:hover {
    background-color: red;
  }
}
```

---

### SASS: Listas
<!-- .slide: style="font-size: 0.90em" -->
Son una secuencia ordenada de valores, como números, colores o cadenas de texto. Los valores se pueden separar por comas o no. El uso de comillas para los valores es solo necesario cuando se usan caracteres especiales.

```scss
$colores: red, green, blue, yellow; // Valores separados con comas
$colores: red green blue yellow; // Valores separados sin comas
$colores: 'red' 'green' 'blue' 'yellow'; // Valores con comillas
```

Puedes acceder a los elementos individuales de una lista utilizando índices, comenzando desde 1.
```scss
$primer-color: nth($colores, 1); // red
$segundo-color: nth($colores, 2); // green
```

<!--https://www.eniun.com/tutorial-sass/-->
---

### SASS: Mapas
Los mapas en Sass son colecciones de pares clave-valor.
```scss
$botones: (
  primary: #3498db,
  secondary: #e74c3c,
  success: #2ecc71
);

$color-primary: map-get($botones, primary); // #3498db
$color-secondary: map-get($botones, secondary); // #e74c3c
```

---

### SASS: Estructuras de control
Permiten desarrollar CSS de una manera más óptima, más organizada y reusable.
- @if
- @for
- @each
- @while

----

### SASS: Estructuras de control
@if: Permite aplicar estilos condicionalmente en función de una expresión booleana.
```scss
$color: blue;
.element {
     @if $color == blue {
       background-color: $color;
     } @else {
       background-color: red;
     }
}
```

----

### SASS: Estructuras de control
@for: Te permite crear bucles for para generar reglas CSS repetitivas.
```scss
@for $i from 1 through 3 {
     .element-#{$i} {
       font-size: 10px * $i;
     }
}
```
Resultado:
```scss
.element-1 {
  font-size: 10px;
}
.element-2 {
  font-size: 20px;
}
.element-3 {
  font-size: 30px;
}
```

----

### SASS: Estructuras de control
@each: Utilizado para iterar sobre listas o mapas y aplicar estilos a cada elemento.
```scss
$colors: red, green, blue;
@each $color in $colors {
     .element-#{$color} {
       background-color: $color;
     }
}
```
Resultado:
```scss
.element-red {
  background-color: red;
}
.element-green {
  background-color: green;
}
.element-blue {
  background-color: blue;
}
```

----

### SASS: Estructuras de control
@while: Permite crear bucles while basados en una condición.
```scss
$i: 1;
@while $i < 4 {
     .element-#{$i} {
       width: 100px * $i;
     }
     $i: $i + 1;
}
```
Resultado:
```scss
.element-1 {
  width: 100px;
}
.element-2 {
  width: 200px;
}
.element-3 {
  width: 300px;
}
```

---

### SASS: Funciones

1. lighten($color, $amount): Aclara un color al aumentar su luminosidad en función de la cantidad especificada.
```scss
$color: #3498db;
$lighter-color: lighten($color, 20%); // Aclara el color un 20%
h1{ color: $lighter-color;}
```
Salida:
```scss
h1 {
  color: #8bc4ea;
}
```

----

### SASS: Funciones

2. darken($color, $amount): Oscurece un color al reducir su luminosidad en función de la cantidad especificada.
```scss
$color: #e74c3c;
$darker-color: darken($color, 10%); // Oscurece el color un 10%
h1{ color: $darker-color;}
```
Salida:
```scss
h1 {
  color: #d62c1a;
}
```

----

### SASS: Funciones
3. rgba($color, $alpha): Cambia la opacidad de un color al agregar un valor alfa.
```scss
$color: #3498db;
$semi-transparent: rgba($color, 0.5); // Cambia la opacidad a 50%
```
4. round($number): Redondea un número al número entero más cercano.
```scss
$value: 3.7;
$rounded-value: round($value); // Redondea a 4
```

----

### SASS: Funciones
5. map-get($map, $key): Obtiene el valor asociado a una clave en un mapa.
```scss
$colors: (primary: #3498db, secondary: #e74c3c);
$primary-color: map-get($colors, primary); // Obtiene el color primario
```

6. nth($list, $n): Obtiene el elemento en la posición $n de una lista.
```scss
$numbers: 1px 2px 3px 4px 5px;
$third-element: nth($numbers, 3); // Obtiene el tercer elemento (3px)
```

----

### SASS: Funciones

7. str-length($string): Obtiene la longitud de una cadena de texto.
```scss
$text: "¡Hola, mundo!";
$text-length: str-length($text); // Obtiene la longitud de la cadena (12)
```
8. unquote($string): Elimina comillas de una cadena de texto.
```scss
$quoted-text: '"Este es un texto entre comillas"';
$unquoted-text: unquote($quoted-text); // Elimina las comillas ("Este es un texto entre comillas")
```

---

### SASS: Operadores aritméticos
Permiten realizar cálculos matemáticos en tiempo de compilación para definir propiedades CSS de manera más dinámica. 

- \+	Suma	$ancho: 100px + 50px;
- –	Resta	$padding: 20px - 10px;
- \*	Multiplica	$columnas: 3 * 4;
- \/	Divide	$ancho-total: 300px / 2;
- %	Resto	$resto: 9 % 4;

---

### SASS: Compilación
Si tienes un archivo Sass llamado **estilos.scss** y quieres compilarlo a **estilos.css**
```bash
sass estilos.scss estilos.css
```

Para observar los cambios en tiempo real mientras trabajas en tu archivo Sass:
```bash
sass --watch estilos.scss estilos.css
```

Para compilar todos los ficheros .scss de un directorio:
```bash
sass ./
```

### SASS: Buenas Prácticas
<!-- .slide: style="font-size: 0.80em" -->
1. **Aprende las bases:** Antes de emplear características avanzadas, asegúrate de entender bien los conceptos básicos como variables, anidación y reglas de estilo.
2. **Organiza tu estructura de archivos:** Dividir los archivos Sass en módulos separados (por ejemplo, _variables.scss, _botones.scss, _encabezados.scss, etc.) y luego importarlos en un archivo principal. Esto facilitará la gestión y el mantenimiento de tus estilos.
3. **Usa variables de manera inteligente:** Aprovecha las variables para almacenar valores reutilizables, como colores, tamaños de fuente y márgenes. Mantén un conjunto coherente de variables para mantener la consistencia en todo tu sitio web.
4. **Evita la anidación excesiva:** Puede generar selectores CSS largos y específicos que son difíciles de mantener. Mantén la anidación a un nivel razonable.

----

### SASS: Buenas Prácticas
<!-- .slide: style="font-size: 0.80em" -->
5. **Documenta tu código:** Agrega comentarios descriptivos en Sass para explicar el propósito de las secciones de código.
6. **Usa funciones con moderación:** reserva su uso para casos donde la reutilización de código es beneficiosa.
7. **Realiza pruebas:** Realiza pruebas en diferentes navegadores para garantizar la compatibilidad.
8. **Control de versiones:** Utiliza un sistema de control de versiones como Git para rastrear cambios en tus archivos Sass.
9. **Mantén actualizadas tus herramientas:** Asegúrate de tener la versión más reciente de Sass y las herramientas de compilación que utilices. Las actualizaciones pueden incluir correcciones de errores y mejoras de rendimiento.
10. **Explora extensiones y librerías:** La comunidad de Sass ofrece muchas extensiones y librerías que pueden ahorrarte tiempo y mejorar tu flujo de trabajo. Investiga y utiliza las que se adapten a tus necesidades.
